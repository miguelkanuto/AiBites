name: Avaliação

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Endereço do site a avaliar"
        default: "https://rag-ex.onrender.com"

jobs:
  avaliacao:
    name: Gate de release (casos reais contra o site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Acordar o site (plano gratuito dorme)
        run: curl --retry 12 --retry-delay 10 --retry-all-errors -fsS "${{ inputs.url }}/api/health"
      - run: uv run python evals/run.py --url "${{ inputs.url }}" --pausa 3
